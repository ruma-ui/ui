name: "CodeQL Configuration"

disable-default-queries: false

queries:
  - uses: security-and-quality
  - uses: security-experimental

paths:
  - ui/src
  - demo/src
  - www/src

paths-ignore:
  - node_modules
  - dist
  - coverage
  - .nx
  - storybook-static
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/*.stories.*"
