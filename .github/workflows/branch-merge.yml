name: Branch Merge Pipeline

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Source branch to merge from"
        required: true
        type: choice
        options:
          - dev
          - alpha
          - beta
          - rc
      target_branch:
        description: "Target branch to merge into"
        required: true
        type: choice
        options:
          - alpha
          - beta
          - rc
          - main
      merge_type:
        description: "Type of merge"
        required: true
        default: "merge"
        type: choice
        options:
          - merge
          - squash

permissions:
  contents: write
  pull-requests: write

jobs:
  # ── Validate the requested merge path ─────────────────────────────────────
  validate-merge:
    name: 🔍 Validate merge path
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      valid: ${{ steps.validation.outputs.valid }}
      reason: ${{ steps.validation.outputs.reason }}
    steps:
      - name: Validate merge path
        id: validation
        run: |
          SOURCE="${{ github.event.inputs.source_branch }}"
          TARGET="${{ github.event.inputs.target_branch }}"

          # Guard: source and target must differ
          if [[ "$SOURCE" == "$TARGET" ]]; then
            echo "valid=false" >> $GITHUB_OUTPUT
            echo "reason=Source and target branches cannot be the same: $SOURCE" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Only allow strictly forward promotion paths
          VALID_PATHS=(
            "dev->alpha"
            "alpha->beta"
            "beta->rc"
            "rc->main"
          )

          MERGE_PATH="${SOURCE}->${TARGET}"
          VALID=false

          for path in "${VALID_PATHS[@]}"; do
            if [[ "$path" == "$MERGE_PATH" ]]; then
              VALID=true
              break
            fi
          done

          if [[ "$VALID" == "true" ]]; then
            echo "valid=true" >> $GITHUB_OUTPUT
            echo "reason=Valid merge path: $MERGE_PATH" >> $GITHUB_OUTPUT
          else
            echo "valid=false" >> $GITHUB_OUTPUT
            echo "reason=Invalid merge path: $MERGE_PATH. Allowed paths: ${VALID_PATHS[*]}" >> $GITHUB_OUTPUT
          fi

  # ── Perform the merge ──────────────────────────────────────────────────────
  merge-branches:
    name: 🔀 Merge ${{ github.event.inputs.source_branch }} → ${{ github.event.inputs.target_branch }}
    needs: validate-merge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: needs.validate-merge.outputs.valid == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git identity
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Perform merge
        run: |
          SOURCE="${{ github.event.inputs.source_branch }}"
          TARGET="${{ github.event.inputs.target_branch }}"
          MERGE_TYPE="${{ github.event.inputs.merge_type }}"

          git fetch origin

          git checkout "$TARGET"
          git pull origin "$TARGET"

          if [[ "$MERGE_TYPE" == "squash" ]]; then
            git merge --squash "origin/$SOURCE"
            git commit -m "feat: squash merge $SOURCE into $TARGET [skip ci]"
          else
            git merge "origin/$SOURCE" --no-ff -m "feat: merge $SOURCE into $TARGET [skip ci]"
          fi

          git push origin "$TARGET"

      - name: Print merge summary
        run: |
          SOURCE="${{ github.event.inputs.source_branch }}"
          TARGET="${{ github.event.inputs.target_branch }}"
          MERGE_TYPE="${{ github.event.inputs.merge_type }}"
          echo "✅ Successfully merged $SOURCE into $TARGET using $MERGE_TYPE"
          echo "🚀 Branch $TARGET is now ready for release"

  # ── Report invalid merge attempt ──────────────────────────────────────────
  merge-failed:
    name: ❌ Invalid merge rejected
    needs: validate-merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: needs.validate-merge.outputs.valid == 'false'
    steps:
      - name: Report invalid merge
        run: |
          echo "❌ ${{ needs.validate-merge.outputs.reason }}"
          exit 1
