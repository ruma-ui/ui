name: CI

on:
  push:
    branches:
      - dev
      - alpha
      - beta
      - rc
      - main
  pull_request:
    branches:
      - dev
      - alpha
      - beta
      - rc
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  # Job to determine what changed and if the actor is Dependabot
  changes:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.final-outputs.outputs.src }}
      config: ${{ steps.final-outputs.outputs.config }}
      workflows: ${{ steps.final-outputs.outputs.workflows }}
      docs: ${{ steps.final-outputs.outputs.docs }}
      is_dependabot: ${{ steps.check-actor.outputs.is_dependabot }}
      run_ci: ${{ steps.final-outputs.outputs.run_ci }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check actor
        id: check-actor
        run: |
          if [[ "${{ github.actor }}" == "dependabot[bot]" ]]; then
            echo "is_dependabot=true" >> $GITHUB_OUTPUT
          else
            echo "is_dependabot=false" >> $GITHUB_OUTPUT
          fi

      - name: Check changed files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            src:
              - 'ui/src/**'
              - 'demo/src/**'
              - 'www/src/**'
            config:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '**/package.json'
              - 'nx.json'
              - 'tsconfig*.json'
            workflows:
              - '.github/workflows/**'
            docs:
              - 'docs/**'
              - '*.md'

      - name: Set final outputs
        id: final-outputs
        run: |
          if [[ "${{ steps.check-actor.outputs.is_dependabot }}" == "true" ]]; then
            echo "src=false" >> $GITHUB_OUTPUT
            echo "config=true" >> $GITHUB_OUTPUT
            echo "workflows=false" >> $GITHUB_OUTPUT
            echo "docs=false" >> $GITHUB_OUTPUT
            echo "run_ci=true" >> $GITHUB_OUTPUT
          else
            echo "src=${{ steps.filter.outputs.src }}" >> $GITHUB_OUTPUT
            echo "config=${{ steps.filter.outputs.config }}" >> $GITHUB_OUTPUT
            echo "workflows=${{ steps.filter.outputs.workflows }}" >> $GITHUB_OUTPUT
            echo "docs=${{ steps.filter.outputs.docs }}" >> $GITHUB_OUTPUT
            if [[ "${{ steps.filter.outputs.src }}" == "true" || "${{ steps.filter.outputs.config }}" == "true" || "${{ steps.filter.outputs.workflows }}" == "true" ]]; then
              echo "run_ci=true" >> $GITHUB_OUTPUT
            else
              echo "run_ci=false" >> $GITHUB_OUTPUT
            fi
          fi

  # A single, comprehensive job for Dependabot to simplify the workflow
  dependabot-ci:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.is_dependabot == 'true'
    steps:
      - name: 🤖 Dependabot PR Validation
        run: echo "Dependabot PR detected - running lightweight CI checks."

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Project
        run: |
          pnpm run lint
          pnpm run typecheck
          pnpm run test
          pnpm run build

      - name: Security audit
        run: pnpm audit --audit-level high
        continue-on-error: true

  # Setup job for regular CI runs
  setup:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.is_dependabot == 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Nx Cloud CI run
        run: pnpm dlx nx start-ci-run --stop-agents-after="build" --agent-count=3

      - name: Upload workspace artifact
        uses: actions/upload-artifact@v4
        with:
          name: workspace-${{ github.sha }}
          path: .
          retention-days: 1

  # Parallel jobs that use the prepared workspace
  lint:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Download workspace artifact
        uses: actions/download-artifact@v4
        with:
          name: workspace-${{ github.sha }}
          path: .
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - name: Restore pnpm store (for dlx)
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Lint
        run: pnpm run lint

  typecheck:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Download workspace artifact
        uses: actions/download-artifact@v4
        with:
          name: workspace-${{ github.sha }}
          path: .
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - name: Restore pnpm store (for dlx)
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Typecheck
        run: pnpm run typecheck

  security:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Download workspace artifact
        uses: actions/download-artifact@v4
        with:
          name: workspace-${{ github.sha }}
          path: .
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - name: Restore pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Run security audit
        run: pnpm audit --audit-level high
        continue-on-error: true
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'

  test:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Download workspace artifact
        uses: actions/download-artifact@v4
        with:
          name: workspace-${{ github.sha }}
          path: .
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - name: Restore pnpm store (for dlx)
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Run unit tests
        run: pnpm run test -- --coverage

  build:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Download workspace artifact
        uses: actions/download-artifact@v4
        with:
          name: workspace-${{ github.sha }}
          path: .
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - name: Restore pnpm store (for dlx)
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Build
        run: pnpm run build
      - name: Build docs
        run: pnpm run docs:build
      - name: Optimization checks
        run: pnpm run size
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ github.sha }}
          path: |
            dist/
            ui/dist/
            docs/
            storybook-static/
      - name: Fix CI issues
        run: pnpm dlx nx fix-ci
        if: always()

  # Notify on failures
  notify-failure:
    needs: [dependabot-ci, lint, typecheck, security, test, build]
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            // ... same script as before, no changes needed here
            const runUrl = `${context.payload.repository.html_url}/actions/runs/${context.runId}`;
            const branch = '${{ github.ref_name }}';
            const needsContext = ${{ toJSON(needs) }};
            let failedJobs = '';

            for (const [job, result] of Object.entries(needsContext)) {
              if (result.result === 'failure') {
                failedJobs += `- ${job}\n`;
              }
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 CI Failed on ${branch}`,
              body: `The CI workflow failed on branch \`${branch}\`.\n\n**Workflow Run:** ${runUrl}\n\n**Failed Jobs:**\n${failedJobs}\nPlease check the logs for details.`,
              labels: ['bug', 'ci', `branch:${branch}`]
            });
