name: CI

on:
  push:
    branches:
      - dev
      - alpha
      - beta
      - rc
      - main
  pull_request:
    branches:
      - dev
      - alpha
      - beta
      - rc
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  # Check what files changed to conditionally run jobs
  changes:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.changes.outputs.src }}
      config: ${{ steps.changes.outputs.config }}
      workflows: ${{ steps.changes.outputs.workflows }}
      docs: ${{ steps.changes.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed files
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            src:
              - 'ui/src/**'
              - 'demo/src/**'
              - 'www/src/**'
            config:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '**/package.json'
              - 'nx.json'
              - 'tsconfig*.json'
            workflows:
              - '.github/workflows/**'
            docs:
              - 'docs/**'
              - '*.md'

  # Initial setup and dependency installation
  setup:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.src == 'true' || needs.changes.outputs.config == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      # Install dependencies with retry
      - name: Install dependencies with retry
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: pnpm install --frozen-lockfile

      # Cache Nx workspace
      - name: Cache Nx workspace
        uses: actions/cache@v4
        with:
          path: |
            .nx/cache
            .nx/workspace-data
          key: ${{ runner.os }}-nx-${{ hashFiles('**/package.json', 'nx.json', '**/project.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-${{ hashFiles('**/package.json', 'nx.json', '**/project.json') }}-
            ${{ runner.os }}-nx-

      - name: Start Nx Cloud CI run
        run: pnpm dlx nx start-ci-run --stop-agents-after="build" --agent-count=3

  # Code quality and linting
  lint:
    runs-on: ubuntu-latest
    needs: [changes, setup]
    if: needs.changes.outputs.src == 'true' || needs.changes.outputs.config == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Restore Nx cache
      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: |
            .nx/cache
            .nx/workspace-data
          key: ${{ runner.os }}-nx-${{ hashFiles('**/package.json', 'nx.json', '**/project.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-${{ hashFiles('**/package.json', 'nx.json', '**/project.json') }}-
            ${{ runner.os }}-nx-

      # Lint using Nx
      - name: Lint
        run: pnpm dlx nx run-many -t lint --parallel=3

  # Type checking
  typecheck:
    runs-on: ubuntu-latest
    needs: [changes, setup]
    if: needs.changes.outputs.src == 'true' || needs.changes.outputs.config == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Restore Nx cache
      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: |
            .nx/cache
            .nx/workspace-data
          key: ${{ runner.os }}-nx-${{ hashFiles('**/package.json', 'nx.json', '**/project.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-${{ hashFiles('**/package.json', 'nx.json', '**/project.json') }}-
            ${{ runner.os }}-nx-

      # Typecheck using Nx
      - name: Typecheck
        run: pnpm dlx nx run-many -t typecheck --parallel=3

  # Security checks
  security:
    runs-on: ubuntu-latest
    needs: [changes, setup]
    if: needs.changes.outputs.src == 'true' || needs.changes.outputs.config == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Security scanning
      - name: Run security audit
        run: pnpm audit --audit-level high
        continue-on-error: true

      # Dependency scanning for PRs
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'

  # Testing
  test:
    runs-on: ubuntu-latest
    needs: [changes, setup]
    if: needs.changes.outputs.src == 'true' || needs.changes.outputs.config == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Restore Nx cache
      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: |
            .nx/cache
            .nx/workspace-data
          key: ${{ runner.os }}-nx-${{ hashFiles('**/package.json', 'nx.json', '**/project.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-${{ hashFiles('**/package.json', 'nx.json', '**/project.json') }}-
            ${{ runner.os }}-nx-

      - name: Run unit tests
        run: pnpm dlx nx run-many -t test --parallel=3 --coverage

  # Build
  build:
    runs-on: ubuntu-latest
    needs: [changes, setup]
    if: needs.changes.outputs.src == 'true' || needs.changes.outputs.config == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Restore Nx cache
      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: |
            .nx/cache
            .nx/workspace-data
          key: ${{ runner.os }}-nx-${{ hashFiles('**/package.json', 'nx.json', '**/project.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-${{ hashFiles('**/package.json', 'nx.json', '**/project.json') }}-
            ${{ runner.os }}-nx-

      - name: Build
        run: pnpm dlx nx run-many -t build --parallel=3

      - name: Build docs
        run: pnpm run docs:build

      - name: Optimization checks
        run: pnpm run size

      # Upload build artifacts
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist/
            ui/dist/
            docs/
            ui/storybook-static/
          retention-days: 30

      # Nx Cloud recommends fixes for failures to help you get CI green faster
      - name: Fix CI issues
        run: pnpm dlx nx fix-ci
        if: always()

  # Notify on failures
  notify-failure:
    needs: [lint, typecheck, security, test, build]
    runs-on: ubuntu-latest
    if: always() && (needs.lint.result == 'failure' || needs.typecheck.result == 'failure' || needs.security.result == 'failure' || needs.test.result == 'failure' || needs.build.result == 'failure')
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.payload.repository.html_url}/actions/runs/${context.runId}`;
            const branch = '${{ github.ref_name }}';

            // Get job statuses from workflow context
            const lintResult = '${{ needs.lint.result }}';
            const typecheckResult = '${{ needs.typecheck.result }}';
            const securityResult = '${{ needs.security.result }}';
            const testResult = '${{ needs.test.result }}';
            const buildResult = '${{ needs.build.result }}';

            // Build the failed jobs list
            let failedJobs = '';
            if (lintResult === 'failure') failedJobs += '- Lint checks\n';
            if (typecheckResult === 'failure') failedJobs += '- Type checks\n';
            if (securityResult === 'failure') failedJobs += '- Security checks\n';
            if (testResult === 'failure') failedJobs += '- Tests\n';
            if (buildResult === 'failure') failedJobs += '- Build\n';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 CI Failed on ${branch}`,
              body: `The CI workflow failed on branch \`${branch}\`.\n\n**Workflow Run:** ${runUrl}\n\n**Failed Jobs:**\n${failedJobs}\nPlease check the logs for details.`,
              labels: ['bug', 'ci', `branch:${branch}`]
            });
