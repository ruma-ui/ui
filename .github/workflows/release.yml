name: Release Pipeline

on:
  push:
    branches:
      - alpha
      - beta
      - rc
      - main
  workflow_dispatch:
    inputs:
      release_type:
        description: "Manual release type"
        required: true
        default: "prerelease"
        type: choice
        options:
          - prerelease
          - stable

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  packages: write

jobs:
  # Pre-release job for alpha, beta, rc branches using Changesets
  prerelease:
    runs-on: ubuntu-latest
    if: contains(fromJson('["alpha", "beta", "rc"]'), github.ref_name) && !contains(github.event.head_commit.message, '[skip ci]')
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run validation
        run: pnpm run validate

      - name: Check bundle size
        run: pnpm run size

      - name: Setup Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Determine prerelease tag
        id: version
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          echo "tag=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "NPM tag: $BRANCH_NAME"

      - name: Build packages
        run: pnpm run build:production

      - name: Create Release Pull Request or Publish (Prerelease)
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset:publish --tag ${{ steps.version.outputs.tag }}
          version: pnpm changeset:version
          commit: "chore: release ${{ github.ref_name }} prerelease"
          title: "chore: release ${{ github.ref_name }} prerelease"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build documentation
        if: steps.changesets.outputs.published == 'true'
        run: pnpm run docs:build

      - name: Upload build artifacts
        if: steps.changesets.outputs.published == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: prerelease-artifacts-${{ github.ref_name }}
          path: |
            dist/
            ui/dist/
            docs/
            storybook-static/
          retention-days: 30

  # Stable release job for main branch using Changesets
  stable-release:
    runs-on: ubuntu-latest
    if: github.ref_name == 'main' && !contains(github.event.head_commit.message, '[skip ci]')
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run validation
        run: pnpm run validate

      - name: Check bundle size
        run: pnpm run size

      - name: Setup Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Build packages
        run: pnpm run build:production

      - name: Create Release Pull Request or Publish (Stable)
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset:publish
          version: pnpm changeset:version
          commit: "chore: release stable version"
          title: "chore: release stable version"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build documentation
        if: steps.changesets.outputs.published == 'true'
        run: pnpm run docs:build

      - name: Upload build artifacts
        if: steps.changesets.outputs.published == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stable-artifacts-${{ github.ref_name }}
          path: |
            dist/
            ui/dist/
            docs/
            storybook-static/
          retention-days: 90

  # Notify on failures
  notify-failure:
    needs: [prerelease, stable-release]
    runs-on: ubuntu-latest
    if: always() && (needs.prerelease.result == 'failure' || needs.stable-release.result == 'failure')
    steps:
      - name: Notify on failure
        uses: actions/github-script@v7
        with:
          script: |
            const branch = '${{ github.ref_name }}';
            const runUrl = `${context.payload.repository.html_url}/actions/runs/${context.runId}`;

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Release Failed on ${branch}`,
              body: `The release workflow failed on branch \`${branch}\`.\n\n**Workflow Run:** ${runUrl}\n\nPlease check the logs for details.`,
              labels: ['bug', 'release', `branch:${branch}`]
            });

  # Update dev branch after stable release
  sync-dev:
    needs: stable-release
    runs-on: ubuntu-latest
    if: needs.stable-release.outputs.published == 'true' && github.ref_name == 'main'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync main back to dev
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git checkout dev
          git merge main --no-ff -m "chore: sync main back to dev after stable release"
          git push origin dev
