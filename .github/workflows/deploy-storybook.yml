name: Deploy Storybook

# Triggers the workflow on push events to the dev branch
on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Fetches all history for git so Chromatic can compare commits
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.8.0

      # Caches the pnpm content-addressable store for faster installs
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # Caches node_modules for projects that might have postinstall scripts
      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        # Only run if the node_modules cache was not hit
        if: steps.cache-deps.outputs.cache-hit != 'true'
        # Retry the command up to 3 times in case of transient network errors
        uses: nick-fields/retry@v2
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm run storybook:build

      - name: Publish to Chromatic
        # UPDATE: Changed from @v1 to @v11 to support the 'onlyStories' flag
        uses: chromaui/action@v1
        with:
          # Use GITHUB_TOKEN for tighter integration
          token: ${{ secrets.GITHUB_TOKEN }}
          # Your project's unique token, stored as a secret
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # Explicitly tell Chromatic where the built Storybook is located
          storybookBuildDir: ui/storybook-static
          # Skip Chromatic tests, only publish the Storybook
          skip: true
          # Don't fail the CI job if visual changes are detected
          exitZeroOnChanges: true
        # Don't block deployment if Chromatic fails for any reason
        continue-on-error: true
